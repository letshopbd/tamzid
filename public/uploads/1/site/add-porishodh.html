<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Porishodh - Dokan Baki Manager</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="container navbar-content">
                <a href="index.html" class="brand-link">
                    <div class="brand-icon">
                        <i data-lucide="layout-dashboard"></i>
                    </div>
                    <span class="brand-text">Dokan Baki</span>
                </a>

                <div class="nav-links">
                    <a href="index.html" class="nav-item">
                        <i data-lucide="layout-dashboard" class="icon-sm"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="customers.html" class="nav-item">
                        <i data-lucide="users" class="icon-sm"></i>
                        <span>Customers</span>
                    </a>
                    <a href="add-baki.html" class="nav-item">
                        <i data-lucide="plus-circle" class="icon-sm"></i>
                        <span>Add Baki</span>
                    </a>
                    <a href="add-porishodh.html" class="nav-item active">
                        <i data-lucide="minus-circle" class="icon-sm"></i>
                        <span>Add Porishodh</span>
                    </a>
                    <button class="logout-btn">
                        <i data-lucide="log-out" class="icon-sm"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content container">
            <div class="max-w-2xl mx-auto">
                <a href="customers.html" class="back-link">
                    <i data-lucide="arrow-left" class="icon-xs"></i>
                    Back to Customers
                </a>

                <div class="form-card">
                    <div class="form-header bg-gray-50">
                        <div>
                            <h1 class="form-title">Add Porishodh (Payment)</h1>
                            <p class="form-subtitle">Record a payment from a customer</p>
                        </div>
                    </div>

                    <form class="form-body">
                        <!-- Customer Select -->
                        <div class="form-group pb-6 border-b border-gray-100">
                            <label class="form-label input-icon-label">
                                <i data-lucide="user" class="icon-xs"></i> Select Customer
                            </label>
                            <div class="select-wrapper">
                                <select class="form-input font-medium" required id="customerSelect">
                                    <option value="">-- Choose a Customer --</option>
                                    <option value="12500">Rahim Store (01712345678) - Due: ৳12,500</option>
                                    <option value="5200">Karim Bhai (01812345678) - Due: ৳5,200</option>
                                </select>
                                <i data-lucide="chevron-down" class="select-arrow"></i>
                            </div>

                            <!-- Dynamic Due Display -->
                            <div id="dueDisplay"
                                class="hidden mt-6 bg-indigo-50 rounded-xl p-4 border border-indigo-100 animate-fadeIn">
                                <p class="text-sm text-indigo-900 text-opacity-70 font-medium">Current Total Due</p>
                                <p class="text-3xl font-bold text-indigo-700 mt-1" id="dueAmount">৳ 0</p>
                            </div>
                        </div>

                        <!-- Payment Details -->
                        <div class="pt-6">
                            <h3 class="form-section-title">
                                <i data-lucide="check-circle" class="icon-sm text-emerald"></i> Enter Payment Details
                            </h3>

                            <div class="grid-2 mb-4">
                                <div class="form-group">
                                    <label class="form-label input-icon-label">
                                        <i data-lucide="calendar" class="icon-xs"></i> Date
                                    </label>
                                    <input type="date" class="form-input focus-emerald" value="2026-01-19">
                                </div>
                                <div class="form-group">
                                    <label class="form-label input-icon-label">
                                        <i data-lucide="clock" class="icon-xs"></i> Time
                                    </label>
                                    <input type="time" class="form-input focus-emerald" value="10:30">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Porishodh Amount (৳)</label>
                                <div class="amount-input-wrapper">
                                    <span class="currency-symbol">৳</span>
                                    <input type="number" class="form-input focus-emerald list-amount"
                                        placeholder="0.00">
                                </div>
                            </div>

                            <div class="form-group mt-4">
                                <label class="form-label">Note (Optional)</label>
                                <input type="text" class="form-input focus-emerald"
                                    placeholder="e.g. Cash payment, bkash...">
                            </div>
                        </div>

                        <button type="submit" class="submit-btn emerald mt-6">
                            <i data-lucide="check-circle" class="icon-sm"></i>
                            Confirm Payment
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();

        // Simple logic for this page demo
        const select = document.getElementById('customerSelect');
        const dueDisplay = document.getElementById('dueDisplay');
        const dueAmount = document.getElementById('dueAmount');

        select.addEventListener('change', (e) => {
            if (e.target.value) {
                dueDisplay.classList.remove('hidden');
                dueAmount.innerText = '৳ ' + Number(e.target.value).toLocaleString();
            } else {
                dueDisplay.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
