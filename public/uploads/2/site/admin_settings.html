<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Duronto Seba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-100 flex-shrink-0 hidden md:flex flex-col h-full">
        <div class="h-16 flex items-center px-6 border-b border-slate-100 flex-shrink-0">
            <a href="admin_dashboard.html"
                class="flex items-center gap-2 text-blue-600 font-bold text-xl tracking-tight">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
                    Admin Panel
                </span>
            </a>
        </div>

        <div class="p-4 space-y-1 flex-1 overflow-y-auto">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-4">Management</div>

            <a href="admin_dashboard.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Dashboard
            </a>

            <a href="admin_service_control.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600">
                <i data-lucide="server" class="w-4 h-4"></i>
                Service Control
            </a>

            <a href="admin_orders.html"
                class="flex items-center justify-between px-3 py-2.5 rounded-lg transition font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600">
                <div class="flex items-center gap-3">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    Orders
                </div>
                <span
                    class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">3</span>
            </a>

            <a href="admin_users.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600">
                <i data-lucide="users" class="w-4 h-4"></i>
                Users
            </a>

            <a href="admin_recharge.html"
                class="flex items-center justify-between px-3 py-2.5 rounded-lg transition font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600">
                <div class="flex items-center gap-3">
                    <i data-lucide="credit-card" class="w-4 h-4"></i>
                    Recharge Requests
                </div>
            </a>

            <a href="admin_settings.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition font-medium bg-blue-50 text-blue-600">
                <i data-lucide="settings" class="w-4 h-4"></i>
                Settings
            </a>
        </div>

        <div class="p-4 border-t border-slate-100 flex-shrink-0">
            <button
                class="w-full flex items-center justify-center gap-2 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition text-sm font-medium">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">System Settings</h1>
                <p class="text-slate-500 text-sm">Manage global website configurations</p>
            </div>
        </header>

        <form>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <!-- Left Column -->
                <div class="space-y-6">
                    <!-- Server Status -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200">
                        <h4
                            class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-wider flex items-center gap-2">
                            Server Status
                        </h4>
                        <div class="grid grid-cols-3 gap-3">
                            <label
                                class="flex flex-col items-center justify-center p-3 rounded-xl cursor-pointer border-2 transition border-blue-500 bg-blue-50 text-blue-700">
                                <input type="radio" name="server_status" checked class="hidden">
                                <span class="font-bold text-sm">ON</span>
                                <span class="text-[10px] uppercase font-bold mt-1 opacity-70">Live</span>
                            </label>
                            <label
                                class="flex flex-col items-center justify-center p-3 rounded-xl cursor-pointer border-2 transition border-slate-200 bg-white text-slate-600 hover:border-slate-300">
                                <input type="radio" name="server_status" class="hidden">
                                <span class="font-bold text-sm">DEV</span>
                                <span class="text-[10px] uppercase font-bold mt-1 opacity-70">Maintenance</span>
                            </label>
                            <label
                                class="flex flex-col items-center justify-center p-3 rounded-xl cursor-pointer border-2 transition border-slate-200 bg-white text-slate-600 hover:border-slate-300">
                                <input type="radio" name="server_status" class="hidden">
                                <span class="font-bold text-sm">DOWN</span>
                                <span class="text-[10px] uppercase font-bold mt-1 opacity-70">Slow</span>
                            </label>
                        </div>
                    </div>

                    <!-- Support Contact -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200">
                        <h4
                            class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-wider flex items-center gap-2">
                            Support Contact
                        </h4>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">WhatsApp Number</label>
                            <input type="text" value="+8801700000000"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-medium text-slate-800 bg-white">
                        </div>
                    </div>

                    <!-- Site Notices -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200">
                        <h4
                            class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-wider flex items-center gap-2">
                            Site Notices
                        </h4>
                        <div class="space-y-4">
                            <div class="flex gap-2">
                                <input type="text" placeholder="Type a new notice..."
                                    class="flex-1 px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500">
                                <button
                                    class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">Add</button>
                            </div>
                            <div class="space-y-2">
                                <div
                                    class="flex items-center justify-between p-3 bg-amber-50 border border-amber-100 rounded-lg group">
                                    <span class="text-sm text-slate-800 font-medium">Welcome to our new platform!</span>
                                    <button class="p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 h-full">
                    <h4 class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-wider flex items-center gap-2">
                        Payment Settings
                    </h4>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Payment Number</label>
                            <input type="text" value="01700000000"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-medium text-slate-800 bg-white">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Minimum Recharge</label>
                            <input type="number" value="100"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-medium text-slate-800 bg-white">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-3">Active Payment Methods</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label
                                    class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 hover:border-blue-300 transition">
                                    <input type="checkbox" checked
                                        class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                                    <span class="text-sm font-bold text-slate-700">Bkash</span>
                                </label>
                                <label
                                    class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 hover:border-blue-300 transition">
                                    <input type="checkbox" checked
                                        class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                                    <span class="text-sm font-bold text-slate-700">Nagad</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button"
                class="w-full px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-8 shadow-lg">
                <i data-lucide="save" class="w-4 h-4"></i>
                Save All Settings
            </button>
        </form>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
