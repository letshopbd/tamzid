<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duronto Seba | Verified NID Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen flex flex-col antialiased font-sans">
    <main
        class="flex-1 gradient-bg relative overflow-hidden flex flex-col items-center justify-center p-4 text-center space-y-8">
        <!-- Main Content -->
        <div class="space-y-4 max-w-2xl flex flex-col items-center">
            <img src="assets/duronto_brand.png" alt="Duronto Seba" class="object-contain h-24 md:h-32 mb-4">
            <p class="text-lg md:text-xl text-slate-600 mb-8 max-w-2xl mx-auto leading-relaxed">
                Your trusted platform for NID services, birth registration, and more. Secure, fast, and trusted by 1000+
                users.
            </p>
        </div>

        <div class="flex gap-4">
            <a href="login.html"
                class="px-8 py-4 bg-slate-800 text-white rounded-xl font-bold shadow-lg hover:bg-slate-900 transition flex items-center gap-2">
                Enter Dashboard <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
            <a href="register.html"
                class="px-8 py-4 bg-white text-slate-700 border border-slate-200 rounded-xl font-bold shadow-sm hover:bg-slate-50 transition">
                Create Account
            </a>
        </div>

        <footer class="absolute bottom-4 text-xs text-slate-400">
            <a href="admin_dashboard.html" class="hover:text-blue-500 transition">Admin Panel Demo</a>

    </main>

    <script>
        lucide.createIcons();
    </script>

</html>
